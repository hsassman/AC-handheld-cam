<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>How Handheld Cam works: phone to PC bridge to the in-game app</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffd60a"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8e8e96"/>
    </marker>
  </defs>
  <rect width="960" height="330" rx="18" fill="#0b0c0e"/>

  <!-- phone -->
  <g transform="translate(40 52)">
    <rect width="230" height="226" rx="16" fill="#16171b" stroke="#2c2e35"/>
    <rect x="80" y="22" width="70" height="118" rx="12" fill="none" stroke="#fff" stroke-width="2.5"/>
    <circle cx="115" cy="118" r="10" fill="#f03b30"/>
    <path d="M95 52h40M95 62h28" stroke="#ffd60a" stroke-width="3" stroke-linecap="round"/>
    <text x="115" y="170" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Your phone</text>
    <text x="115" y="192" fill="#9a9aa2" font-size="13" text-anchor="middle">web app in the browser</text>
    <text x="115" y="210" fill="#9a9aa2" font-size="13" text-anchor="middle">motion, zoom, thumbstick</text>
  </g>

  <!-- PC -->
  <g transform="translate(365 52)">
    <rect width="230" height="226" rx="16" fill="#16171b" stroke="#2c2e35"/>
    <rect x="62" y="28" width="106" height="70" rx="6" fill="none" stroke="#fff" stroke-width="2.5"/>
    <path d="M100 98v18M86 116h58" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M78 76l18-14 16 10 20-18 22 16" fill="none" stroke="#ffd60a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="115" y="170" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Phone link (bridge)</text>
    <text x="115" y="192" fill="#9a9aa2" font-size="13" text-anchor="middle">started by the game itself</text>
    <text x="115" y="210" fill="#9a9aa2" font-size="13" text-anchor="middle">HTTPS app, QR, live feed</text>
  </g>

  <!-- game -->
  <g transform="translate(690 52)">
    <rect width="230" height="226" rx="16" fill="#16171b" stroke="#2c2e35"/>
    <rect x="66" y="36" width="76" height="50" rx="9" fill="none" stroke="#fff" stroke-width="2.5"/>
    <circle cx="92" cy="61" r="13" fill="none" stroke="#ffd60a" stroke-width="2.5"/>
    <path d="M142 50l24-12v46l-24-12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M58 122q57-26 114 0" fill="none" stroke="#8e8e96" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="115" y="170" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Assetto Corsa</text>
    <text x="115" y="192" fill="#9a9aa2" font-size="13" text-anchor="middle">CSP Lua app moves the</text>
    <text x="115" y="210" fill="#9a9aa2" font-size="13" text-anchor="middle">in-game camera</text>
  </g>

  <!-- links -->
  <path d="M276 140H358" stroke="#ffd60a" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M358 178H276" stroke="#8e8e96" stroke-width="2" marker-end="url(#b)"/>
  <text x="317" y="128" fill="#ffd60a" font-size="12" font-weight="700" text-anchor="middle">Wi-Fi</text>
  <text x="317" y="200" fill="#8e8e96" font-size="11" text-anchor="middle">status, feed</text>

  <path d="M601 140H683" stroke="#ffd60a" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M683 178H601" stroke="#8e8e96" stroke-width="2" marker-end="url(#b)"/>
  <text x="642" y="128" fill="#ffd60a" font-size="12" font-weight="700" text-anchor="middle">UDP (local)</text>
  <text x="642" y="200" fill="#8e8e96" font-size="11" text-anchor="middle">camera status</text>

  <text x="480" y="312" fill="#6d6d75" font-size="12" text-anchor="middle">Motion streams at the display rate as a quaternion. The game buffers ~30-150 ms and interpolates, so Wi-Fi jitter never shows.</text>
</svg>
