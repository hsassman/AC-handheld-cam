[ABOUT]
NAME = Handheld Cam
AUTHOR = Hayden
VERSION = 0.3.4
DESCRIPTION = Phone-controlled handheld camera (quaternion motion, hold-to-walk, photo shots, live feed, QR/USB pairing)
REQUIRED_VERSION = 2000
URL =

[CORE]
; PARTIAL: script loads when the app window is first opened and keeps running
; (socket + camera override) until AC closes. That's what we want here —
; no need to run the listener before the player has opened the app once.
LAZY = PARTIAL

[WINDOW_...]
; Required for CSP to register the app's window/icon in the in-game app
; bar. Without this section the app is still visible in Content Manager's
; app browser (it only reads [ABOUT]) but never appears in-game.
ID = main
NAME = Handheld Cam
ICON = icon.png
FUNCTION_MAIN = windowMain
; FIXED_SIZE removed so the window can be freely stretched/resized in-game.
; SIZE is now just the initial size; MIN_SIZE keeps the tabbed layout usable.
SIZE = 360, 440
MIN_SIZE = 300, 320
